name: CI

# CI runs on every push and pull request to main, plus manual dispatch.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege token: both jobs only read the repo and run tests. A job that
# ever needs write (release, PR comment) should declare its own narrower block.
permissions:
  contents: read

# Cancel in-progress runs for the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint imports, boot & test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The images' Python (python:3.11-slim): CI tests what ships.
          python-version: "3.11"
          cache: pip

      # Path rules never see a real key pasted into a tracked file (a template, a fixture, a
      # doc). Prints `path:line: kind`, never the value.
      - name: Secret scan (credential formats in tracked files)
        run: python scripts/ci/leak_scan.py --tracked

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/proxy/requirements.txt -r tests/requirements-test.txt

      # The licence rule in THIRD_PARTY_LICENSES.md: every pin of every image and CI lockfile is
      # permissive, or MPL-2.0 for an unmodified transitive dependency. Reads each pinned
      # release's licence (installed metadata, else pypi.org) and exits 1 on anything else.
      - name: Licence audit (every pin permissive or MPL-2.0)
        run: python scripts/audit_licenses.py

      - name: Clean-checkout boot gate (import main with no commercial files)
        working-directory: src/proxy
        env:
          PYTHONPATH: ${{ github.workspace }}/src/proxy
        run: python -c "import main; print('boot OK:', main.app.title)"

      - name: Collection gate (no test imports a missing/gated module)
        run: pytest tests/ --collect-only -q

      - name: G02 prompt-template token-budget gate
        run: bash scripts/ci/validate-templates.sh

      - name: Tenant isolation gate (cross-tenant invariants must hold)
        run: pytest tests/unit/test_isolation_invariants.py tests/unit/tenancy tests/unit/middleware/test_multi_tenancy.py -q

      # The WHOLE tree, not just tests/unit. ~590 tests live at tests/ root and in
      # tests/integration, and until 2026-09-04 no gate and no CI job ever executed them
      # — the collection gate above imported them and stopped there. Two tests sat broken
      # on main as a result. Commercial-only tests self-skip on the OSS tree (28 skipped),
      # which is what makes running the full tree safe here.
      - name: Tests (full tree)
        run: pytest tests/ -q

  tier-build:
    name: Tier build matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Public CI only ever has the FREE (OSS) tree — the commercial files are
        # gitignored, so the ENTERPRISE leg runs privately via
        # scripts/test-tiers.sh where those files exist. The matrix is kept as a
        # list so a commercial CI can add the `enterprise` leg later.
        tier: [free]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The images' Python (python:3.11-slim): CI tests what ships.
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/proxy/requirements.txt -r tests/requirements-test.txt

      - name: Build the ${{ matrix.tier }} tree (git archive HEAD — commercial files absent)
        run: |
          mkdir -p /tmp/${{ matrix.tier }}-tree
          git archive HEAD | tar -x -C /tmp/${{ matrix.tier }}-tree

      - name: "${{ matrix.tier }}: boot (import main, commercial absent)"
        working-directory: /tmp/${{ matrix.tier }}-tree/src/proxy
        env:
          PYTHONPATH: /tmp/${{ matrix.tier }}-tree/src/proxy
        run: python -c "import main; print('${{ matrix.tier }} boot OK:', main.app.title)"

      - name: "${{ matrix.tier }}: isolation (no commercial files / no gated imports in core)"
        run: |
          tree=/tmp/${{ matrix.tier }}-tree
          # Commercial paths come from the commercial sections of .gitignore, so a new
          # commercial module is checked as soon as its .gitignore line exists. The tree
          # is `git archive HEAD`: a file tracked here is a file in the tree.
          if ! leaked=$(python scripts/ci/commercial_paths.py --tracked); then
            echo "LEAK: commercial files in the ${{ matrix.tier }} tree:"; echo "$leaked"; exit 1
          fi
          if ! leaked=$(python scripts/ci/commercial_paths.py --dockerignore src/proxy); then
            echo "LEAK: commercial paths missing from src/proxy/.dockerignore:"; echo "$leaked"; exit 1
          fi
          if grep -nE "is_group_enabled|include_router\(create_|from billing\.tiers|from api\.portal|from api\.gdpr" \
               "$tree/src/proxy/main.py" "$tree/src/proxy/middleware/pipeline.py"; then
            echo "LEAK: gated import/wiring in core"; exit 1
          fi
          echo "${{ matrix.tier }} isolation OK"

      - name: "${{ matrix.tier }}: core engines present (never gated)"
        run: |
          tree=/tmp/${{ matrix.tier }}-tree
          for c in src/proxy/billing/metering.py src/proxy/billing/models.py \
                   src/proxy/billing/api.py src/proxy/audit/log.py; do
            if [ ! -e "$tree/$c" ]; then echo "MISSING core engine: $c"; exit 1; fi
          done
          echo "core engines ship OK"
