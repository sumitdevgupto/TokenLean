# Dependabot policy — pins are the signal, floors are not.
#
# The proxy runtime and test deps are PINNED lockfiles compiled from *.in files
# by scripts/compile-requirements.sh (pip-compile). A Dependabot PR against a
# lockfile changes what actually installs and CI tests exactly that change — so
# version updates stay ON for the TESTS lockfile and GitHub Actions. The PROXY
# lockfile is refreshed via the script instead (see that entry's comment:
# Dependabot's regenerator cannot honor its CUDA exclusions).
#
# The sidecar/pipeline images compile the same way (their requirements.in), and
# the script refreshes them for the proxy's reason (torch). Docker base images and
# the Java sample have reasons of their own (see each entry). Version updates are
# therefore DISABLED (open-pull-requests-limit: 0) for all of these —
# SECURITY updates are exempt from that limit and still open PRs.
#
# With auto-merge disabled and CODEOWNERS review required, every bump still
# waits for maintainer approval.
version: 2

updates:
  # GitHub Actions used by .github/workflows/ci.yml — pinned to commit SHAs, so
  # this entry is the ONLY signal when upstream tags move. Keep it on.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"

  # Proxy runtime lockfile (src/proxy/requirements.txt, compiled from
  # requirements.in) — what ships in the image. Version-update PRs are DISABLED
  # here: Dependabot regenerates pip-compile lockfiles with a plain re-resolve
  # that does NOT honor the --unsafe-package exclusions or the CUDA sweep
  # (proven by PR #33, which re-pinned torch + the ~17-package CUDA runtime and
  # went red on tests/unit/test_requirements_pinned.py), so every PR it opened
  # would fail CI by design. Refresh the pins deliberately instead:
  #   bash scripts/compile-requirements.sh   (then commit both files)
  # Security updates still flow — treat a security PR here as the ALERT and
  # apply the fix via the script rather than merging the PR as-is.
  - package-ecosystem: pip
    directory: /src/proxy
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    commit-message:
      prefix: deps
    ignore:
      # qdrant-client is deliberately pinned to the running server's minor
      # (>=1.12,<1.13). The client refuses a client/server minor gap greater
      # than 1, so it can only move when the Qdrant server moves with it —
      # see infra/variables.tf + docker-compose.yml. Patches stay in scope.
      # (Belt: tests/unit/test_qdrant_version_alignment.py red-flags any bump
      # that slips past this ignore — proven against PRs #30/#32.)
      - dependency-name: qdrant-client
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  # Test lockfile (tests/requirements-test.txt, compiled from
  # requirements-test.in) — installed by CI on every run.
  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: deps-test
    groups:
      test-deps:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Sidecar / pipeline images — each requirements.txt is compiled from its
  # requirements.in by scripts/compile-requirements.sh. Version-update PRs stay
  # DISABLED for the proxy's reason: Dependabot's regenerator cannot keep torch
  # out of the pins. Security updates still flow (the limit does not apply to
  # them): treat one as the alert and apply it via the script.
  - package-ecosystem: pip
    directories:
      - /src/doc-pipeline
      - /src/finetune-pipeline
      - /src/llmlingua-sidecar
      - /src/routellm-sidecar
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    commit-message:
      prefix: deps-sidecar
    ignore:
      # Same lockstep constraint as the proxy: the pipelines write into the very
      # collections the proxy reads, so their client must track the server too.
      # Kept even at limit 0 so a SECURITY update cannot bump past the pin
      # (the alert still appears in the Security tab).
      - dependency-name: qdrant-client
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  # Docker base images — every FROM is pinned by digest, so a rebuild takes the same OS and
  # Python patch level. Dependabot proposes each tag's new digest (its OS and security
  # patches), monthly, for review. New tags stay out: a major or minor bump (postgres 15→18,
  # python 3.11→3.13) needs verification nothing in CI performs (no job builds these images).
  # Deliberate upgrades are tracked in internal-docs/demand-driven-features.md.
  - package-ecosystem: docker
    directories:
      - /infra/migrations
      - /src/doc-pipeline
      - /src/finetune-pipeline
      - /src/llmlingua-sidecar
      - /src/proxy
      - /src/routellm-sidecar
      - /src/tika-sidecar
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: docker
    groups:
      base-images:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  # Java client sample — openai-java 4.x moved its model packages, so a version
  # bump alone ships a non-compiling sample (no CI job builds Java). DISABLED
  # until the template is rewritten for the 4.x API (tracked in
  # internal-docs/demand-driven-features.md). Security updates still flow.
  - package-ecosystem: maven
    directory: /src/templates/java
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    commit-message:
      prefix: deps-java
