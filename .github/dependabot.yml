# Dependabot policy — pins are the signal, floors are not.
#
# The proxy runtime and test deps are PINNED lockfiles compiled from *.in files
# by scripts/compile-requirements.sh (pip-compile). A Dependabot PR against them
# changes what actually installs, CI tests exactly that change, and green means
# something — so version updates stay ON there (monthly, grouped).
#
# Everywhere else the manifests are open ">=" floors: pip already resolves to
# latest on every install, so a floor-bump PR changes nothing about built
# artifacts. Version updates are therefore DISABLED (open-pull-requests-limit: 0)
# for the sidecar/pipeline manifests, Docker base images, and the Java sample —
# SECURITY updates are exempt from that limit and still open PRs.
#
# With auto-merge disabled and CODEOWNERS review required, every bump still
# waits for maintainer approval.
version: 2

updates:
  # GitHub Actions used by .github/workflows/ci.yml — pinned to commit SHAs, so
  # this entry is the ONLY signal when upstream tags move. Keep it on.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"

  # Proxy runtime lockfile (src/proxy/requirements.txt, compiled from
  # requirements.in) — what ships in the image. Bumps here are real: CI installs
  # the changed pins and the full unit suite runs against them.
  - package-ecosystem: pip
    directory: /src/proxy
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      proxy-runtime:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # qdrant-client is deliberately pinned to the running server's minor
      # (>=1.12,<1.13). The client refuses a client/server minor gap greater
      # than 1, so it can only move when the Qdrant server moves with it —
      # see infra/variables.tf + docker-compose.yml. Patches stay in scope.
      # (Belt: tests/unit/test_qdrant_version_alignment.py red-flags any bump
      # that slips past this ignore — proven against PRs #30/#32.)
      - dependency-name: qdrant-client
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  # Test lockfile (tests/requirements-test.txt, compiled from
  # requirements-test.in) — installed by CI on every run.
  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: deps-test
    groups:
      test-deps:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Sidecar / pipeline manifests — open floors in separate containers, not the
  # proxy runtime. Installs already resolve to latest, so version-update PRs
  # here are documentation churn: DISABLED. Security updates still flow (the
  # limit does not apply to them).
  - package-ecosystem: pip
    directories:
      - /src/doc-pipeline
      - /src/finetune-pipeline
      - /src/llmlingua-sidecar
      - /src/routellm-sidecar
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    commit-message:
      prefix: deps-sidecar
    ignore:
      # Same lockstep constraint as the proxy: the pipelines write into the very
      # collections the proxy reads, so their client must track the server too.
      # Kept even at limit 0 so a SECURITY update cannot bump past the pin
      # (the alert still appears in the Security tab).
      - dependency-name: qdrant-client
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  # Docker base images — major bumps (postgres 15→18, tika 2→3) need human
  # verification nothing in CI performs (no job builds these images), so
  # version-update PRs are noise: DISABLED. Security updates still flow.
  # Deliberate upgrades are tracked in internal-docs/demand-driven-features.md.
  - package-ecosystem: docker
    directories:
      - /infra/migrations
      - /src/doc-pipeline
      - /src/finetune-pipeline
      - /src/llmlingua-sidecar
      - /src/proxy
      - /src/routellm-sidecar
      - /src/tika-sidecar
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    commit-message:
      prefix: docker

  # Java client sample — openai-java 4.x moved its model packages, so a version
  # bump alone ships a non-compiling sample (no CI job builds Java). DISABLED
  # until the template is rewritten for the 4.x API (tracked in
  # internal-docs/demand-driven-features.md). Security updates still flow.
  - package-ecosystem: maven
    directory: /src/templates/java
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    commit-message:
      prefix: deps-java
